[project]
name = "thesis-radar"
version = "0.2.0"
description = "Judge new research passages against your investment thesis with TypeSafe's Jev."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "ruamel.yaml>=0.18",
  "pypdf>=4",
  "python-docx>=1.1",
  "portalocker>=2.8",
  "typesafe-sdk>=0.5.7",
]

[project.scripts]
radar = "thesis_radar.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "playwright>=1.47"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thesis_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not live and not ui'"
markers = [
  "live: calls the real TypeSafe API (needs TYPESAFE_API_KEY)",
  "ui: drives the dashboard in a headless browser (needs playwright and chromium)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM108", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["thesis_radar"]
