[project]
name = "thesis-radar"
version = "0.1.0"
description = "Judge new research passages against your investment thesis with TypeSafe's Jev."
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "pypdf>=4",
  "python-docx>=1.1",
  "portalocker>=2.8",
  "typesafe-sdk>=0.5.7",
]

[project.scripts]
radar = "thesis_radar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thesis_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real TypeSafe API (needs TYPESAFE_API_KEY)"]
