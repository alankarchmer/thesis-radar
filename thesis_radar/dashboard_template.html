<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>thesis-radar</title>
<style>
/* ---------------------------------------------------------------- tokens */
:root {
  --bg: #f7f6f3; --surface: #ffffff; --surface-2: #f2f1ed; --chart: #fcfcfb;
  --ink: #1d1c1a; --ink-2: #52514e; --muted: #898781; --line: #e4e2dc; --line-2: #cfccc3; --grid: #e1e0d9;
  --for: #2a78d6; --against: #e34948; --neutral: #f0efec;
  --warn: #8a5300; --warn-mark: #c98a1e; --warn-bg: #fdf4e3; --warn-line: #eccb8e;
  --hover: rgba(29, 28, 26, 0.055); --scrim: rgba(12, 12, 10, 0.42);
  --shadow: 0 1px 2px rgba(20, 18, 10, 0.05); --lift: 0 12px 32px rgba(20, 18, 10, 0.16);
  --radius: 12px; --head-h: 120px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --surface: #1d1d1b; --surface-2: #262624; --chart: #1a1a19;
    --ink: #edebe5; --ink-2: #c3c2b7; --muted: #898781; --line: #33322f; --line-2: #4a4843; --grid: #2c2c2a;
    --for: #3987e5; --against: #e66767; --neutral: #383835;
    --warn: #e8b35c; --warn-mark: #e8b35c; --warn-bg: rgba(232, 179, 92, 0.10); --warn-line: rgba(232, 179, 92, 0.35);
    --hover: rgba(255, 255, 255, 0.06); --scrim: rgba(0, 0, 0, 0.6); --shadow: none; --lift: 0 12px 32px rgba(0, 0, 0, 0.5);
  }
}

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); overflow-x: hidden; }
body.locked { overflow: hidden; }
body.has-bar main { padding-bottom: 160px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-underline-offset: 2px; }
code, kbd, pre { font-family: var(--mono); font-size: 12px; }
code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; overflow-wrap: anywhere; }
kbd { border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink-2); background: var(--surface); font-size: 11px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h2 { font-size: 18px; margin: 0; letter-spacing: -0.01em; font-weight: 650; }
h3 { font-size: 14px; margin: 18px 0 6px; font-weight: 650; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 8px; white-space: nowrap; }
.btn:hover { border-color: var(--line-2); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn[aria-expanded="true"] { background: var(--surface-2); border-color: var(--line-2); }
.ghost { border: 0; background: none; color: var(--ink-2); padding: 4px 8px; border-radius: 7px; font-size: 13px; white-space: nowrap; }
.ghost:hover { background: var(--hover); color: var(--ink); }
.ghost[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
.link-btn { border: 0; background: none; padding: 0; color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
.link-btn:hover { color: var(--ink); }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 12px; line-height: 20px; color: var(--ink-2); white-space: nowrap; }
.warn-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 0 8px 0 6px; font-size: 12px; line-height: 20px; font-weight: 600; color: var(--warn); background: var(--warn-bg); border: 1px solid var(--warn-line); white-space: nowrap; }
.warn-chip .i { color: var(--warn-mark); }

/* ---------------------------------------------------------------- header */
header.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 8px 16px; padding: 10px 16px 2px; flex-wrap: wrap; max-width: 1120px; margin: 0 auto; }
.brand { font-size: 15px; font-weight: 750; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { color: var(--muted); }
nav#tabs { display: flex; gap: 2px; overflow-x: auto; min-width: 0; flex: 1 1 auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 5px 10px; border-radius: 8px; white-space: nowrap; color: var(--ink-2); }
.tab:hover { background: var(--hover); color: var(--ink); }
.tab.active { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: 0 0 0 1px var(--line); }
.tab .badge { margin-left: 6px; }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 11.5px; font-weight: 650; text-align: center; line-height: 18px; }
.tools { display: flex; gap: 6px; align-items: center; min-width: 0; }
#search { width: 210px; min-width: 0; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
#status-chip { border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn); border-radius: 999px; padding: 4px 11px 4px 9px; font-size: 12.5px; font-weight: 650; white-space: nowrap; }
#status-chip .i { color: var(--warn-mark); margin-right: 4px; }
.status-line { max-width: 1120px; margin: 0 auto; padding: 2px 16px 8px; font-size: 12px; color: var(--muted); }
nav#sections { max-width: 1120px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav#sections[hidden] { display: none; }
.sec { border: 0; background: none; padding: 7px 10px 8px; font-size: 14px; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.sec:hover { color: var(--ink); }
.sec.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 650; }
.sec .badge { margin-left: 5px; }
.popover { position: absolute; right: 16px; top: calc(100% + 6px); width: min(480px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--lift); padding: 12px 14px; z-index: 40; }
.popover[hidden] { display: none; }
.popover h2 { font-size: 15px; margin-bottom: 6px; }
.status-row { padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.status-row:first-of-type { border-top: 0; }
.cmd-line { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
@media (max-width: 640px) {
  .bar { padding: 8px 16px 2px; }
  .brand { font-size: 14px; }
  nav#tabs { flex: 1 1 0; }
  .tools { flex: 1 1 100%; }
  #search { flex: 1; width: auto; }
  #status-chip .long { display: none; }
  .filters { position: static; }
}

/* ---------------------------------------------------------------- layout */
main { max-width: 1120px; margin: 0 auto; padding: 4px 16px 56px; }
.page-head { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; margin: 18px 0 2px; }
.page-head h2 { font-size: 21px; }
.section { margin-top: 26px; }
.section-head { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; margin-bottom: 4px; }
.section-head .grow { flex: 1; }
.lede { color: var(--ink-2); font-size: 13px; margin: 2px 0 8px; max-width: 70ch; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
details.fold { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
details.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; color: var(--muted); width: 12px; }
details.fold[open] > summary::before { content: "▾"; }
details.fold.inner { border-top: 0; padding-top: 0; margin-top: 8px; }
.group { margin-top: 16px; }
.group-head { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; margin: 0 0 2px; font-size: 14px; font-weight: 650; }
.group-head .desc { color: var(--muted); font-weight: 400; font-size: 12.5px; }
.more-btn { margin: 2px 0 6px; }
.filters { position: sticky; top: var(--head-h); z-index: 12; background: var(--bg); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 10px 0 8px; margin-top: 6px; border-bottom: 1px solid var(--line); }
.filters select, .filters input[type="date"], .filters input[type="search"] { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 8px; font-size: 13px; max-width: 100%; min-width: 0; }
.filters input[type="search"] { flex: 1 1 160px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; background: var(--surface); white-space: nowrap; }
.toggle input { margin: 0; accent-color: var(--ink); }
.confirm { display: inline-flex; gap: 6px; align-items: center; background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 8px; padding: 2px 4px 2px 10px; font-size: 12.5px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 16px 8px; margin: 10px 0; box-shadow: var(--shadow); scroll-margin: calc(var(--head-h) + 64px) 0 150px; position: relative; }
.card:focus { outline: none; }
.card.focused { box-shadow: 0 0 0 2px var(--ink); }
.card.contra { border-left: 3px solid var(--against); padding-left: 14px; }
.card.spot { border: 1.5px dashed var(--line-2); }
.card.done .quote { color: var(--ink-2); }
.spot-head { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-weight: 650; font-size: 13.5px; }
.spot-head .muted { font-weight: 400; font-size: 12.5px; flex-basis: 100%; }
.src { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 0; align-items: baseline; margin-bottom: 6px; }
.src > * + *:not(.chip)::before, .facts > * + *::before, .read-next > * + *::before, .prediction .meta > * + *::before { content: "·"; display: inline-block; text-decoration: none; margin: 0 7px; color: var(--line-2); }
.src .src-name { color: var(--ink-2); font-weight: 600; }
.src > .chip { margin-left: 8px; }
.src .src-title { color: var(--ink-2); overflow-wrap: anywhere; }
.src .new-mark { color: var(--ink); font-weight: 600; }
.src .new-mark i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); margin-right: 5px; vertical-align: 1px; }
.flags { display: flex; flex-wrap: wrap; gap: 3px 16px; font-size: 12.5px; color: var(--ink-2); margin: 0 0 6px; }
.flag .i { color: var(--muted); margin-right: 5px; font-style: normal; }
.flag-btn { border: 0; background: none; padding: 0; color: var(--ink-2); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.quote { margin: 0 0 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15.5px; line-height: 1.6; color: var(--ink); }
.quote.clamp-6, .quote.clamp-2 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.quote.clamp-6 { -webkit-line-clamp: 6; }
.quote.clamp-2 { -webkit-line-clamp: 2; }
.quote + .link-btn { margin: -2px 0 8px; display: inline-block; }
.speaker { font-weight: 650; }
mark { background: rgba(255, 196, 0, 0.35); color: inherit; border-radius: 2px; }
.rels { display: grid; gap: 3px; margin: 2px 0 6px; font-size: 13px; }
.rel { display: flex; gap: 7px; align-items: center; min-width: 0; color: var(--ink); }
.mark { flex: none; width: 16px; height: 16px; border-radius: 4px; display: inline-grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; font-style: normal; line-height: 1; }
.mark.for { background: var(--for); } .mark.against { background: var(--against); } .mark.q { background: var(--muted); }
.mark.warn { background: var(--warn-mark); } .mark.flat { background: var(--muted); }
.rel-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.facts { font-size: 12.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 0; align-items: center; }
.dots { display: inline-flex; gap: 3px; margin-right: 6px; vertical-align: 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.dots i.on { background: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; gap: 0 2px; margin: 6px 0 0 -8px; align-items: center; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 25; min-width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--lift); padding: 5px; display: grid; }
.menu-item { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 13px; color: var(--ink); }
.menu-item:hover, .menu-item:focus-visible { background: var(--hover); outline: none; }
.panel-x { margin: 8px 0 4px; padding: 9px 11px; border-radius: 9px; background: var(--surface-2); font-size: 13px; overflow-wrap: anywhere; }
.panel-x ul { margin: 0; padding-left: 16px; }
.panel-x .muted { font-size: 12px; }
.diff { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; line-height: 1.6; }
ins { text-decoration: underline 2px var(--for); text-underline-offset: 3px; background: color-mix(in srgb, var(--for) 10%, transparent); }
del { text-decoration: line-through 1.5px var(--against); color: var(--ink-2); background: color-mix(in srgb, var(--against) 9%, transparent); }
form.absorb { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; align-items: center; padding: 9px; border-radius: 9px; background: var(--surface-2); }
form.absorb input[type="text"] { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; background: var(--surface); }
form.absorb select { border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; background: var(--surface); max-width: 100%; }
.check { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; color: var(--ink-2); }

/* ---------------------------------------------------------------- verdicts, board */
.verdict { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 650; color: var(--ink); white-space: nowrap; }
.verdict .vm { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; }
.verdict.holding .vm, .verdict.turning_for .vm { background: var(--for); }
.verdict.contradicted .vm, .verdict.turning_against .vm { background: var(--against); }
.verdict.mixed .vm { background: var(--muted); }
.verdict.quiet { color: var(--ink-2); font-weight: 500; }
.verdict.quiet .vm { border: 1.5px solid var(--line-2); color: var(--muted); }
.board { display: grid; gap: 18px; margin-top: 18px; }
.board-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 12px; box-shadow: var(--shadow); min-width: 0; }
.board-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.board-head h2 .ticker { color: var(--muted); font-weight: 500; font-size: 14px; margin-left: 6px; }
.read-next { margin: 10px 0 4px; font-size: 13.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 0; align-items: baseline; }
.read-next .label { font-weight: 650; color: var(--ink); }
.next-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; }
.next-list > li, .metric-lines > li, .signals > li, .board > *, .scorecard > * { min-width: 0; }
.next-item { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; margin-left: -8px; border-radius: 8px; font-size: 13.5px; min-width: 0; }
.next-item:hover { background: var(--hover); }
.next-item .mark { align-self: center; }
.next-item .dotmark { flex: none; width: 16px; text-align: center; color: var(--muted); }
.next-item .where { color: var(--muted); white-space: nowrap; flex: none; }
.next-item .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: var(--ink); }
.board-sub { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 18px 0 4px; font-weight: 650; }
.score-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.score-row:first-child { border-top: 0; }
.score-text { min-width: 0; }
.score-statement { margin: 0 0 4px; font-size: 14px; color: var(--ink); }
button.score-statement { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
button.score-statement:hover { text-decoration-color: var(--ink); }
.score-meta { display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: center; }
.note { color: var(--muted); font-size: 12.5px; }
.score-row.large { grid-template-columns: minmax(0, 1fr) auto; padding: 14px 0; }
.metric-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.metric-line { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--ink); }
.metric-line .mark { margin-top: 2px; }
.signals { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.signals li { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--ink); }
.signals li .mark { margin-top: 2px; }
.howto { margin-top: 24px; }
.howto ul { margin: 8px 0 0; padding-left: 18px; color: var(--ink-2); max-width: 75ch; }
.howto li { margin: 4px 0; }
@media (max-width: 720px) {
  .score-row, .score-row.large { grid-template-columns: minmax(0, 1fr); }
  .board-card { padding: 14px 14px 10px; }
  .next-item .where { display: none; }
}

/* ---------------------------------------------------------------- charts */
.tide-wrap { display: inline-block; line-height: 0; }
svg.tide, svg.db, svg.mchart { overflow: visible; display: block; }
.tide .bar-for { fill: var(--for); }
.tide .bar-against { fill: var(--against); }
.tide .base { stroke: var(--muted); stroke-width: 1; shape-rendering: crispEdges; }
.tide .tick, .db .axis-label, .mchart .xtick, .mchart .ytick { fill: var(--muted); font-size: 10.5px; font-family: var(--sans); }
.hit { fill: transparent; }
.hit:hover { fill: var(--hover); }
.hit:focus { outline: none; }
.hit:focus-visible { fill: var(--hover); stroke: var(--ink); stroke-width: 1.5; }
.chart-card { background: var(--chart); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-top: 10px; }
.tone-scroll { overflow-x: auto; padding-bottom: 2px; }
.tone-grid { display: grid; gap: 3px; align-items: center; min-width: 360px; }
.tone-grid .lbl { font-size: 12.5px; color: var(--ink-2); padding-right: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tone-grid .mon { font-size: 10.5px; color: var(--muted); text-align: center; }
.tone-cell, .tone-empty { height: 28px; border-radius: 4px; border: 0; padding: 0; min-width: 0; }
.tone-empty { background: transparent; }
.tone-cell:hover { box-shadow: 0 0 0 2px var(--ink); }
.tone-cell.pos.s1 { background: color-mix(in srgb, var(--for) 25%, var(--neutral)); }
.tone-cell.pos.s2 { background: color-mix(in srgb, var(--for) 50%, var(--neutral)); }
.tone-cell.pos.s3 { background: color-mix(in srgb, var(--for) 75%, var(--neutral)); }
.tone-cell.pos.s4 { background: var(--for); }
.tone-cell.neg.s1 { background: color-mix(in srgb, var(--against) 25%, var(--neutral)); }
.tone-cell.neg.s2 { background: color-mix(in srgb, var(--against) 50%, var(--neutral)); }
.tone-cell.neg.s3 { background: color-mix(in srgb, var(--against) 75%, var(--neutral)); }
.tone-cell.neg.s4 { background: var(--against); }
.tone-cell.mid.s1 { background: color-mix(in srgb, var(--muted) 18%, var(--neutral)); }
.tone-cell.mid.s2 { background: color-mix(in srgb, var(--muted) 36%, var(--neutral)); }
.tone-cell.mid.s3 { background: color-mix(in srgb, var(--muted) 54%, var(--neutral)); }
.tone-cell.mid.s4 { background: color-mix(in srgb, var(--muted) 72%, var(--neutral)); }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 10px; align-items: center; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
.legend .sw.pos { background: var(--for); } .legend .sw.neg { background: var(--against); } .legend .sw.mid { background: color-mix(in srgb, var(--muted) 45%, var(--neutral)); }
table.data { border-collapse: collapse; font-size: 13px; width: 100%; }
table.data th, table.data td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.data th { font-weight: 650; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
table.data td { white-space: nowrap; }
table.data .qtext { white-space: normal; min-width: 26ch; }
.table-scroll { overflow-x: auto; }
.db-row { padding: 12px 0; border-top: 1px solid var(--grid); }
.db-row:first-child { border-top: 0; }
.db-head { display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; font-size: 13.5px; }

.db-sentence { color: var(--ink-2); font-size: 13px; margin: 2px 0 4px; }
.db .axis { stroke: var(--grid); stroke-width: 2; }

.db .dot-in { fill: var(--ink); } .db .dot-out { fill: var(--muted); }
.db .dot-label { fill: var(--ink-2); font-size: 11.5px; font-family: var(--sans); }
.promise { display: grid; gap: 6px; padding: 12px 0; border-top: 1px solid var(--grid); }
.promise:first-child { border-top: 0; }

.mini-quote { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 11px; }
.mini-quote:hover { border-color: var(--line-2); }
.mini-quote .mq-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.mini-quote .mq-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; color: var(--ink); }
.arrow-down { color: var(--muted); font-size: 12px; padding-left: 12px; }

.metric-figure { display: flex; gap: 4px 12px; align-items: baseline; flex-wrap: wrap; margin: 8px 0 4px; }
.metric-value { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.metric-change { display: inline-flex; gap: 6px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.metric-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 2px; }
.mchip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px 1px 3px; background: var(--surface); white-space: nowrap; }
.mchip .mark { width: 15px; height: 15px; border-radius: 50%; font-size: 9px; }
.mchart .grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.mchart .rep-line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.mchart .rep { fill: var(--ink); }
.mchart .guide { fill: color-mix(in srgb, var(--muted) 55%, var(--neutral)); }
.mchart .guide.old { fill: color-mix(in srgb, var(--muted) 28%, var(--neutral)); }
.mchart .est { fill: var(--chart); stroke: var(--muted); stroke-width: 1.5; }
.mchart .est-range { stroke: var(--muted); stroke-width: 1.5; }
.mchart .end-label { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--sans); }
.chart-key { font-size: 12px; color: var(--ink-2); margin-top: 8px; }
details.qnum { display: inline-block; vertical-align: top; }
.sep { white-space: pre; }
details.qnum > summary { display: inline; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; list-style: none; }
details.qnum > summary::-webkit-details-marker { display: none; }
details.qnum[open] > summary { font-weight: 650; }
.qtext { display: block; font-size: 12.5px; color: var(--ink-2); margin: 4px 0; max-width: 46ch; }
pre.yaml { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; overflow-x: auto; }
.change { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin: 8px 0; background: var(--surface); }
.change .meta { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; }
.fact { padding: 7px 0; border-top: 1px solid var(--grid); display: grid; gap: 2px; }
.fact .meta { font-size: 12px; color: var(--muted); display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: center; }
.prediction { padding: 12px 0; border-top: 1px solid var(--grid); }
.prediction:first-child { border-top: 0; }
.prediction .meta { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 2px 0; flex-wrap: wrap; margin: 2px 0 4px; }
.pill { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 12px; font-weight: 650; border: 1px solid var(--line); }
.pill.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }

/* ---------------------------------------------------------------- overlays, bars, tooltips */
#thresholds { max-width: 1120px; margin: 12px auto 0; padding: 0 16px; }
.th { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.th-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px 18px; }
.slider { display: grid; grid-template-columns: 1fr 52px; gap: 0 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); margin: 0 0 4px; }
.slider output { text-align: right; font-family: var(--mono); color: var(--ink); grid-row: 1; grid-column: 2; }
.th-counts { margin: 10px 0; display: grid; gap: 4px; font-size: 13px; }
.th-counts .changed { font-weight: 700; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#overlay { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; justify-content: center; align-items: flex-start; padding: 24px 12px; overflow-y: auto; }
#overlay[hidden] { display: none; }
#overlay.drawer { justify-content: flex-end; padding: 0; }
.sheet { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 860px; box-shadow: var(--lift); }
.sheet.drawer { max-width: 620px; min-height: 100%; border-radius: 0; border-width: 0 0 0 1px; }
.sheet-head { position: sticky; top: -24px; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 8px 12px; align-items: flex-start; justify-content: space-between; border-radius: 14px 14px 0 0; }
.sheet.drawer .sheet-head { top: 0; border-radius: 0; }
.sheet-head > div { min-width: 0; }
.sheet-head h2 { font-size: 16px; }
.sheet-head .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 2px 10px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
.sheet-body { padding: 8px 16px 20px; }
.skim-p { padding: 9px 11px; margin: 6px 0; border-radius: 9px; border: 1px solid transparent; scroll-margin: 110px 0 40px; }
.skim-p .quote { font-size: 14.5px; margin: 0; }
.skim-p .meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; gap: 2px 10px; flex-wrap: wrap; }
.skim-p.hl-new { background: var(--surface); border-color: var(--line-2); }
.skim-p.hl-maybe { background: var(--surface); border-color: var(--line); }
.skim-p.contra { background: var(--surface); border-color: var(--line); box-shadow: inset 3px 0 0 var(--against); }
.skim-p.unjudged { color: var(--muted); }
.skim-p.skim-current { box-shadow: 0 0 0 2px var(--ink); }
.skim-p.contra.skim-current { box-shadow: inset 3px 0 0 var(--against), 0 0 0 2px var(--ink); }
.stub { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 3px 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.skim-note { font-size: 12.5px; color: var(--warn); margin-top: 4px; }
.help-grid { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 13.5px; align-items: baseline; }
.copybox { width: 100%; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--surface); }
#actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.08); padding: 8px 16px; }
#actionbar[hidden] { display: none; }
.ab-row { max-width: 1120px; margin: 0 auto; display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.ab-row + .ab-row { margin-top: 6px; }
.cmd { flex: 1 1 260px; min-width: 0; max-height: 3.2em; overflow: auto; white-space: pre-wrap; word-break: break-all; display: block; padding: 3px 6px; }
#tip { position: fixed; z-index: 70; max-width: min(360px, calc(100vw - 16px)); background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.45; padding: 7px 10px; border-radius: 8px; pointer-events: none; white-space: pre-line; box-shadow: var(--lift); }
#tip[hidden] { display: none; }
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: grid; gap: 6px; justify-items: end; pointer-events: none; }
body.has-bar #toasts { bottom: 110px; }
.toast { background: var(--ink); color: var(--bg); padding: 7px 12px; border-radius: 8px; font-size: 13px; max-width: min(420px, calc(100vw - 32px)); box-shadow: var(--lift); }
.toast.error { background: var(--against); color: #fff; }
@media (max-width: 640px) {
  .card { padding: 12px 13px 8px; }
  .card.contra { padding-left: 12px; }
  .quote { font-size: 15px; }
  .sheet-body { padding: 6px 10px 14px; }
  .metric-card { padding: 14px 13px 12px; }
}
</style>

<body>
<svg id="svg-ns" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"></svg>
<header class="top" id="top">
  <div class="bar">
    <h1 class="brand">thesis<span>·</span>radar</h1>
    <nav id="tabs" role="tablist" aria-label="Views"></nav>
    <div class="tools">
      <input id="search" type="search" placeholder="Search passages" aria-label="Search passages (/)" autocomplete="off" data-fkey="search">
      <button id="status-chip" type="button" hidden aria-expanded="false" aria-controls="status-panel"></button>
      <button id="btn-thresholds" class="btn" type="button" aria-expanded="false" aria-controls="thresholds">Thresholds</button>
      <button id="btn-help" class="btn" type="button" aria-label="Keyboard shortcuts and help (?)">?</button>
    </div>
  </div>
  <div id="status-line" class="status-line"></div>
  <nav id="sections" aria-label="Company sections" hidden></nav>
  <div id="status-panel" class="popover" role="dialog" aria-label="Pipeline status" hidden></div>
</header>
<section id="thresholds" hidden aria-label="Thresholds"></section>
<main id="app"></main>
<div id="actionbar" hidden></div>
<div id="overlay" hidden></div>
<div id="tip" role="tooltip" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script id="radar-data" type="application/json">__RADAR_DATA__</script>
<script id="radar-logic">
"use strict";
// Pure functions shared with the tests (run under node). No DOM access here.
const RadarLogic = (() => {
  const DAY_MS = 86400000;
  const CLEARS_FEED = ["dismissed", "absorbed"];
  const DEFAULT_POLICY = {
    metadata_min_probability: 0.6, whats_new_window_days: 30, pillar_probability_min: 0.5, boilerplate_max: 0.3,
    new_info_min: 0.6, materiality_min: 1.5, contradictions_window_days: 120, contradicts_min: 0.7,
    contradiction_materiality_min: 1.0, contradiction_boilerplate_max: 0.5, maybe_new_info_low: 0.4, maybe_new_info_high: 0.6,
    open_questions_min: 0.6, divergence_window_days: 120, divergence_min_gap: 1.0, divergence_min_passages: 3,
    ledger_min_probability: 0.6, metric_min_probability: 0.6,
  };
  const isNum = (v) => typeof v === "number" && Number.isFinite(v);
  const num = (v, fallback) => (isNum(v) ? v : fallback);
  const pct = (v) => (isNum(v) ? Math.round(v * 100) + "%" : "–");
  const f1 = (v) => (isNum(v) ? v.toFixed(1) : "–");

  // --- dates -------------------------------------------------------------
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function passageDate(passage) {
    if (!passage) return null;
    const raw = passage.date || (passage.ingested_at ? String(passage.ingested_at).slice(0, 10) : null);
    return raw ? String(raw).slice(0, 10) : null;
  }
  function shiftDate(iso, days) {
    return new Date(Date.parse(String(iso).slice(0, 10) + "T00:00:00Z") + days * DAY_MS).toISOString().slice(0, 10);
  }
  function recent(passage, days, today) {
    const d = passageDate(passage);
    return d !== null && d >= shiftDate(today, -Math.trunc(days));
  }
  function monthsBack(today, n) {
    const y = +String(today).slice(0, 4), m = +String(today).slice(5, 7);
    const out = [];
    for (let i = n - 1; i >= 0; i--) {
      const k = y * 12 + (m - 1) - i;
      out.push(Math.floor(k / 12) + "-" + String((k % 12) + 1).padStart(2, "0"));
    }
    return out;
  }
  function monthLabel(month) {
    const s = String(month || ""), name = MONTHS[+s.slice(5, 7) - 1];
    return name ? name + " " + s.slice(0, 4) : s;
  }
  const monthShort = (month) => MONTHS[+String(month || "").slice(5, 7) - 1] || "";
  function formatDate(iso) {
    const s = String(iso || "").slice(0, 10);
    if (!/^\d{4}-\d\d-\d\d$/.test(s)) return s || "Undated";
    return MONTHS[+s.slice(5, 7) - 1] + " " + +s.slice(8, 10) + ", " + s.slice(0, 4);
  }
  function shortDate(iso) {
    const s = String(iso || "").slice(0, 10);
    return /^\d{4}-\d\d-\d\d$/.test(s) ? MONTHS[+s.slice(5, 7) - 1] + " " + +s.slice(8, 10) : s;
  }
  function byNewest(a, b) {
    const da = passageDate(a) || "", db = passageDate(b) || "";
    if (da !== db) return da < db ? 1 : -1;
    return a.id === b.id ? 0 : a.id < b.id ? 1 : -1;
  }

  // --- classification (spec section 4) -------------------------------------
  function triageStatus(passage) {
    const t = passage && passage.triage;
    if (!t) return null;
    return typeof t === "string" ? t : t.status || null;
  }
  function evidence(p, policy) {
    const asm = (p && p.assumptions) || {};
    const qs = (p && p.questions) || {};
    const min = policy.contradicts_min;
    const contradicts = Object.keys(asm).filter((a) => asm[a] && isNum(asm[a].contradicts) && asm[a].contradicts >= min).sort();
    const supports = Object.keys(asm)
      .filter((a) => asm[a] && isNum(asm[a].supports) && asm[a].supports >= min && !contradicts.includes(a)).sort();
    const questions = Object.keys(qs).filter((q) => isNum(qs[q]) && qs[q] >= policy.open_questions_min).sort();
    return { contradicts, supports, questions };
  }
  function checks(passage, policy, today) {
    const p = passage.p;
    const status = triageStatus(passage);
    const ev = evidence(p, policy);
    const mat = num(p.materiality, 0), bp = num(p.boilerplate, 1), ni = num(p.new_info, 0);
    const onPillar = !!p.pillar && p.pillar !== "off_thesis" && num(p.pillar_p, 0) >= policy.pillar_probability_min;
    const bpContra = num(policy.contradiction_boilerplate_max, DEFAULT_POLICY.contradiction_boilerplate_max);
    const contraRaw = ev.contradicts.length > 0 && mat >= policy.contradiction_materiality_min && bp <= bpContra;
    const recentContra = recent(passage, policy.contradictions_window_days, today);
    const recentNew = recent(passage, policy.whats_new_window_days, today);
    const base = onPillar && bp <= policy.boilerplate_max && mat >= policy.materiality_min;
    const eligible = base && !contraRaw && recentNew && !CLEARS_FEED.includes(status);
    const inNew = eligible && ni >= policy.new_info_min;
    const inMaybe = eligible && !inNew && policy.maybe_new_info_low <= ni && ni < policy.maybe_new_info_high;
    const inContra = contraRaw && recentContra && status !== "acknowledged";
    const flagged = contraRaw || (base && ni >= policy.maybe_new_info_low);
    return { p, status, ev, mat, bp, bpContra, ni, onPillar, contraRaw, recentContra, recentNew, inNew, inMaybe, inContra, flagged };
  }
  function classify(passage, policy, today) {
    if (!passage || !passage.p) {
      return { in_contradictions: false, in_whats_new: false, in_maybe: false, flagged: false,
               contradicts: [], supports: [], questions: [] };
    }
    const c = checks(passage, policy, today);
    return { in_contradictions: c.inContra, in_whats_new: c.inNew, in_maybe: c.inMaybe, flagged: c.flagged,
             contradicts: c.ev.contradicts, supports: c.ev.supports, questions: c.ev.questions };
  }
  function isAcknowledgedContradiction(passage, policy, today) {
    return triageStatus(passage) === "acknowledged" &&
      classify(Object.assign({}, passage, { triage: null }), policy, today).in_contradictions;
  }
  function countFeeds(passages, policy, today) {
    const n = { contradictions: 0, whats_new: 0, maybe: 0 };
    for (const p of passages || []) {
      const c = classify(p, policy, today);
      if (c.in_contradictions) n.contradictions++;
      if (c.in_whats_new) n.whats_new++;
      if (c.in_maybe) n.maybe++;
    }
    return n;
  }
  function readNext(passages, policy, today, n) {
    const items = [];
    for (const p of passages || []) {
      const c = classify(p, policy, today);
      if (c.in_contradictions) items.push([0, p]);
      else if (c.in_whats_new) items.push([1, p]);
    }
    items.sort((a, b) => a[0] - b[0] || num(b[1].p.materiality, 0) - num(a[1].p.materiality, 0) || byNewest(a[1], b[1]));
    return items.slice(0, n || 3).map(([rank, p]) => ({ id: p.id, kind: rank ? "new" : "contradiction" }));
  }

  // --- "why is this here" -----------------------------------------------------
  function whyShown(passage, policy, today, names) {
    if (!passage || !passage.p) return ["Not judged yet, so no thresholds apply to this passage."];
    const c = checks(passage, policy, today);
    const p = c.p, asm = p.assumptions || {}, qs = p.questions || {};
    const label = (kind, id) => (names && names[kind] && names[kind][id] ? "“" + names[kind][id] + "”" : id);
    const date = formatDate(passageDate(passage));
    const out = [];
    const tick = (ok, text) => out.push((ok ? "✓ " : "✗ ") + text);
    if (c.inContra) out.push("Shown under Contradictions.");
    else if (c.inNew) out.push("Shown under What's new.");
    else if (c.inMaybe) out.push("Shown under Maybe.");
    else if (c.contraRaw && c.status === "acknowledged") out.push("A contradiction you acknowledged.");
    else out.push(c.flagged ? "Flagged, but not in a feed right now." : "Not flagged at the current thresholds.");
    for (const a of c.ev.contradicts) tick(true, `Contradicts ${label("assumptions", a)} (${pct(asm[a].contradicts)} likely; threshold ${pct(policy.contradicts_min)})`);
    if (c.ev.contradicts.length) {
      const matOk = c.mat >= policy.contradiction_materiality_min;
      tick(matOk, `Materiality ${f1(c.mat)} of 3 (contradictions need ${f1(policy.contradiction_materiality_min)})`);
      const bpOk = c.bp <= c.bpContra;
      tick(bpOk, `${bpOk ? "Not" : "Likely"} boilerplate (${pct(c.bp)}; limit ${pct(c.bpContra)}): a risk disclosure about what could happen is not a contradiction`);
      if (c.contraRaw) {
        tick(c.recentContra, `Dated ${date}, ${c.recentContra ? "inside" : "outside"} the ${policy.contradictions_window_days}-day contradiction window`);
        if (c.status === "acknowledged") tick(false, "You acknowledged this contradiction");
        out.push("Contradictions are never repeated under What's new or Maybe.");
      }
    }
    if (!c.contraRaw) {
      if (!p.pillar || p.pillar === "off_thesis") tick(false, "Not about any pillar of your thesis");
      else tick(c.onPillar, `About ${label("pillars", p.pillar)} (${pct(p.pillar_p)} likely; minimum ${pct(policy.pillar_probability_min)})`);
      const bpOk = c.bp <= policy.boilerplate_max;
      tick(bpOk, `${bpOk ? "Not" : "Likely"} boilerplate (${pct(c.bp)}; limit ${pct(policy.boilerplate_max)})`);
      const matOk = c.mat >= policy.materiality_min;
      tick(matOk, `Materiality ${f1(c.mat)} of 3 (minimum ${f1(policy.materiality_min)})`);
      const low = policy.maybe_new_info_low, high = policy.maybe_new_info_high;
      if (c.ni >= policy.new_info_min) tick(true, `New to you: ${pct(c.ni)} (minimum ${pct(policy.new_info_min)})`);
      else if (c.ni >= low && c.ni < high) tick(true, `New to you: ${pct(c.ni)}, in the Maybe band (${pct(low)}–${pct(high)})`);
      else tick(false, `New to you: ${pct(c.ni)}, below ${pct(policy.new_info_min)} and outside the Maybe band (${pct(low)}–${pct(high)})`);
      tick(c.recentNew, `Dated ${date}, ${c.recentNew ? "inside" : "outside"} the ${policy.whats_new_window_days}-day What's new window`);
      if (CLEARS_FEED.includes(c.status)) tick(false, `You marked it ${c.status}`);
    }
    for (const a of c.ev.supports) tick(true, `Supports ${label("assumptions", a)} (${pct(asm[a].supports)} likely; threshold ${pct(policy.contradicts_min)})`);
    for (const q of c.ev.questions) tick(true, `Bears on ${label("questions", q)} (${pct(qs[q])} likely; minimum ${pct(policy.open_questions_min)})`);
    return out;
  }

  // --- assumption verdicts (last six months vs the six before) ---------------
  const RECENT_DAYS = 182, EARLIER_DAYS = 364;
  function falseAlarms(passage) {
    const t = passage && passage.triage;
    return t && typeof t === "object" && Array.isArray(t.false_alarms) ? t.false_alarms : [];
  }
  function evidenceSide(passage, assumptionId, policy) {
    const p = passage && passage.p;

  function setPolicy(key, value) {
    S.policy[key] = value;
    if (key === "maybe_new_info_low" && S.policy.maybe_new_info_high <= value) S.policy.maybe_new_info_high = Math.min(1, roundTo(value + 0.01, 0.01));
    if (key === "maybe_new_info_high" && S.policy.maybe_new_info_low >= value) S.policy.maybe_new_info_low = Math.max(0, roundTo(value - 0.01, 0.01));
    scheduleRender();
  }
  function setAll(values) {
    S.policy = Object.assign({}, DEFAULTS, values);
    render();
  }
  function savePolicy() {
    const values = {};
    for (const key of Object.keys(L.DEFAULT_POLICY)) values[key] = S.policy[key];
    S.saved = Object.assign({}, S.policy);
    dispatch([{ op: "policy", values }]);
    render();
  }
  function syncThresholds() {
    if (TH_PANEL.hidden) return;
    for (const input of TH_PANEL.querySelectorAll("input[data-policy]")) {
      const key = input.dataset.policy;
      if (String(input.value) !== String(S.policy[key])) input.value = S.policy[key];
      TH_PANEL.querySelector('[data-out="' + key + '"]').textContent = sliderText(key);
    }
    const dirty = Object.keys(L.DEFAULT_POLICY).some((k) => S.policy[k] !== S.saved[k]);
    byId("th-state").textContent = dirty ? "changed from saved" : "at saved values";
    byId("th-counts").replaceChildren(...COMPANIES.map((c) => {
      const before = L.countFeeds(c.passages, S.saved, TODAY), now = L.countFeeds(c.passages, S.policy, TODAY);
      const part = (text, key) => el("span", { class: before[key] !== now[key] ? "changed" : "", "data-live": key }, text + " " + before[key] + " → " + now[key]);
      return el("div", { "data-ticker": c.ticker }, el("b", {}, c.ticker), " ", part("Contradictions", "contradictions"), " · ",
        part("What's new", "whats_new"), " · ", part("Maybe", "maybe"));
    }));
  }
  let frame = 0;
  function scheduleRender() {
    if (frame) return;
    frame = requestAnimationFrame(() => { frame = 0; render(); });
  }

  // ================================================================ chrome: tabs, sections, status
  function renderTabs() {
    const tabs = [["overview", "Overview", null]].concat(COMPANIES.map((c) => [c.ticker, c.ticker, feeds(c).fresh.length]),
      [["unsorted", "Unsorted (" + UNSORTED.length + ")", null]]);
    NAV.replaceChildren(...tabs.map(([key, text, badge]) => el("button", {
      class: "tab" + (S.tab === key && !S.search ? " active" : ""), type: "button", role: "tab", "data-tab": key,
      "aria-selected": String(S.tab === key), onclick: () => switchTab(key) },
      text, badge === null ? null : el("span", { class: "badge", title: "New passages" }, String(badge)))));
  }
  function renderSections() {
    const c = company(S.tab);
    if (!c || S.search) { SECTIONS.hidden = true; SECTIONS.replaceChildren(); return; }
    const f = feeds(c);
    const counts = {
      read: f.contra.length + f.fresh.length, thesis: c.assumptions.length, metrics: c.metrics.length || null,
      signals: c.divergence.filter((d) => d.flagged).length || null,
      filings: c.redlines.reduce((n, r) => n + (r.changed || []).length, 0) || null,
    };
    SECTIONS.hidden = false;
    SECTIONS.replaceChildren(...SECTION_IDS.map((id) => el("button", { class: "sec" + (S.section === id ? " active" : ""), type: "button",
      "data-section-tab": id, "aria-current": S.section === id ? "page" : null, title: SECTION_NAMES[id] + " (g then " + id[0] + ")",
      onclick: () => switchSection(id) }, SECTION_NAMES[id], counts[id] === null ? null : countBadge(counts[id]))));
  }
  function hashFor() {
    return S.tab === "overview" || S.tab === "unsorted" ? S.tab : S.tab + "/" + S.section;
  }
  function writeHash() {
    const h = "#" + hashFor();
    if (location.hash === h) return;
    try { history.pushState(null, "", h); } catch (err) { location.hash = h; }
  }
  function readHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return false;
    const [tab, section] = raw.split("/");
    let changed = false;
    if ((tab === "overview" || tab === "unsorted" || company(tab)) && S.tab !== tab) { S.tab = tab; changed = true; }
    const next = section && SECTION_IDS.includes(section) ? section : company(tab) ? "read" : S.section;
    if (next !== S.section) { S.section = next; changed = true; }
    return changed;
  }
  function switchTab(key, section) {
    S.tab = key;
    if (section) S.section = section;
    S.focus = null;
    S.confirm = null;
    S.menu = null;
    if (S.search) { SEARCH.value = ""; S.search = null; }
    writeHash();
    render();
    window.scrollTo(0, 0);
  }
  function switchSection(id) {
    const c = company(S.tab) || COMPANIES[0];
    if (!c) return;
    switchTab(c.ticker, id);
  }
  function renderChrome() {
    const pending = DATA.pending || {};
    const total = (pending.stale || 0) + (pending.unjudged || 0) + (pending.failed || 0);
    CHIP.hidden = !total;
    CHIP.replaceChildren(el("span", { class: "i", "aria-hidden": "true" }, "⚠"), String(total), el("span", { class: "long" }, total === 1 ? " needs attention" : " need attention"));
    CHIP.setAttribute("aria-label", plural(total, "item needs", "items need") + " attention: open the pipeline status");
    const row = (count, what, command, why) => (count ? el("div", { class: "status-row" },
      el("div", {}, el("b", {}, count + " " + what), " " + why),
      el("div", { class: "cmd-line" }, el("code", {}, command), el("button", { class: "ghost", type: "button", onclick: () => copyText(command, "command") }, "Copy"))) : null);
    STATUS_PANEL.replaceChildren(el("h2", {}, "Pipeline status"),
      el("p", { class: "muted small", style: "margin:0 0 4px" }, "Housekeeping: none of this changes what you read, but fixing it keeps the scores current."),
      row(pending.stale, pending.stale === 1 ? "stale judgment" : "stale judgments", "radar judge --all", "shown from before your last thesis edit. Re-judge to refresh them."),
      row(pending.unjudged, pending.unjudged === 1 ? "passage not judged yet" : "passages not judged yet", "radar judge", "are waiting for Jev."),
      row(pending.failed, pending.failed === 1 ? "judgment failed" : "judgments failed", "radar judge --retry-failed", "can be retried."));
  }
  function renderStatusLine() {
    const arrived = COMPANIES.reduce((n, c) => n + arrivedCount(c), 0);
    byId("status-line").replaceChildren(el("span", { title: DATA.generated_at || "" }, "Updated " + stamp(DATA.generated_at)),
      " · ", DATA.previous_view ? plural(arrived, "new passage") + " since your last visit" : "Your first visit");
  }
  function toggleStatus(force) {
    const open = force === undefined ? STATUS_PANEL.hidden : force;
    STATUS_PANEL.hidden = !open;
    CHIP.setAttribute("aria-expanded", String(open));
  }
  function renderActionBar() {
    const rows = S.older.map((entry) => {
      const command = L.applyCommand(entry.actions);
      return el("div", { class: "ab-row older" },
        el("strong", {}, plural(entry.actions.length, "action") + " from the dashboard generated " + stamp(entry.generated) +
          (entry.actions.length === 1 ? " was" : " were") + " never cleared"),
        el("code", { class: "cmd" }, command),
        el("button", { class: "btn", type: "button", onclick: () => copyText(command, "radar apply command") }, "Copy command"),
        el("button", { class: "btn", type: "button", onclick: () => discardOlder(entry) }, "Discard"));
    });
    if (S.queue.length) {
      const command = L.applyCommand(S.queue);
      rows.push(el("div", { class: "ab-row" },
        el("strong", { "data-queue": S.queue.length }, TOKEN ? plural(S.queue.length, "unsaved action") : plural(S.queue.length, "queued action")),
        el("code", { class: "cmd", id: "apply-command" }, command),
        TOKEN ? el("button", { class: "btn primary", type: "button", onclick: flush }, "Retry") : null,
        el("button", { class: "btn", type: "button", onclick: () => copyText(command, "radar apply command") }, "Copy command"),
        el("button", { class: "btn", type: "button", title: "Forget queued actions (after you ran the command)",
                       onclick: () => { S.queue = []; persist(); renderActionBar(); } }, "Clear")));
    }
    if (S.selected.size) {
      rows.push(el("div", { class: "ab-row" }, el("strong", {}, plural(S.selected.size, "passage") + " selected"),
        el("button", { class: "btn primary", type: "button", onclick: () => copyText(L.markdownQuotes([...S.selected.values()]), "Markdown quotes") }, "Copy as Markdown quotes"),
        el("button", { class: "btn", type: "button", onclick: () => { S.selected.clear(); render(); } }, "Clear selection")));
    }
    BAR.hidden = !rows.length;
    BAR.replaceChildren(...rows);
    document.body.classList.toggle("has-bar", rows.length > 0);
  }

  // ================================================================ render
  function render() {
    CLS = new WeakMap();
    EV = new Map();
    const active = document.activeElement;
    const fkey = active && active.dataset && active.dataset.fkey;
    const caret = fkey && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
    renderTabs();
    renderSections();
    renderStatusLine();
    const view = S.search ? viewSearch() : S.tab === "overview" ? viewOverview() : S.tab === "unsorted" ? viewUnsorted() : viewCompany(company(S.tab));
    APP.replaceChildren(...[view].flat(Infinity).filter(Boolean));
    renderActionBar();
    syncThresholds();
    if (S.overlay && S.overlay.kind !== "help") drawOverlay();
    if (fkey && fkey !== "search") {
      const again = document.querySelector('[data-fkey="' + CSS.escape(fkey) + '"]');
      if (again) { again.focus(); if (caret) try { again.setSelectionRange(caret[0], caret[1]); } catch (err) { /* date inputs */ } }
    }
    measureHeader();
  }
  function measureHeader() {
    document.documentElement.style.setProperty("--head-h", HEADER.offsetHeight + "px");
  }

  // ================================================================ keyboard and events
  function isTyping(t) {
    if (!t || !t.tagName) return false;
    if (t.isContentEditable || t.tagName === "TEXTAREA" || t.tagName === "SELECT") return true;
    return t.tagName === "INPUT" && !["checkbox", "radio", "range", "button", "submit", "reset"].includes(t.type);
  }
  function escape(t, typing) {
    if (S.menu) { const key = S.menu; closeMenu(); const b = document.querySelector('.card[data-key="' + CSS.escape(key) + '"] .more'); if (b) b.focus(); return; }
    if (!STATUS_PANEL.hidden) { toggleStatus(false); CHIP.focus(); return; }
    if (S.absorb) { S.absorb = null; render(); refocus(focusIndex()); return; }
    if (S.overlay) { closeOverlay(); return; }
    if (t === SEARCH) { clearSearch(); SEARCH.blur(); return; }
    if (typing) { t.blur(); return; }
    if (S.confirm) { S.confirm = null; render(); return; }
    if (S.search) clearSearch();
  }
  function withCard(fn, allowSpot) {
    const ref = focusedRef();
    if (!ref) { toast("Press j to pick a card first"); return; }
    if (ref.spot && !allowSpot) { toast("This is a spot check: answer y or n"); return; }
    fn(ref);
  }
  const KEYS = {
    j: () => move(1), k: () => move(-1), u: undo, "?": toggleHelp,
    "/": () => { SEARCH.focus(); SEARCH.select(); },
    g: () => { S.g = true; setTimeout(() => { S.g = false; }, 1500); },
    d: () => withCard((r) => leave(r.c, r.p, "d")), x: () => withCard((r) => leave(r.c, r.p, "x")),
    a: () => withCard((r) => startAbsorb(r.c, r.p, r.key)), s: () => withCard((r) => toggleStar(r.c, r.p)),
    c: () => withCard((r) => verdictAction(r.c, r.p, 1)), f: () => withCard((r) => verdictAction(r.c, r.p, 0)),
    o: () => withCard((r) => openLink(r.p.link), true), v: () => withCard((r) => openSkim(r.c, r.p.document_id, r.p.id), true),
    y: () => { const r = focusedRef(); if (r && r.spot) answerSpot(r.c, r.p, true); },
    n: () => { const r = focusedRef(); if (r && r.spot) answerSpot(r.c, r.p, false); },
  };
  document.addEventListener("keydown", (e) => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    const typing = isTyping(e.target);
    if (e.key === "Escape") { escape(e.target, typing); return; }
    if (typing) return;
    if (S.overlay && S.overlay.kind === "skim") {
      const fn = { n: () => skimJump(1), p: () => skimJump(-1), o: () => openLink(S.overlay.doc.link), "?": toggleHelp }[e.key];
      if (fn) { e.preventDefault(); fn(); }
      return;
    }
    if (S.overlay) { if (e.key === "?") { e.preventDefault(); toggleHelp(); } return; }
    if (S.g) {
      S.g = false;
      let target = null;
      if (e.key === "o") target = () => switchTab("overview");
      else if (e.key === "u") target = () => switchTab("unsorted");
      else if (/^[1-9]$/.test(e.key) && COMPANIES[+e.key - 1]) target = () => switchTab(COMPANIES[+e.key - 1].ticker);
      else if (SECTION_KEYS[e.key]) target = () => switchSection(SECTION_KEYS[e.key]);
      if (target) { e.preventDefault(); target(); }
      return;
    }
    const fn = KEYS[e.key];
    if (fn) {
      e.preventDefault();
      if (S.menu && e.key !== "?") closeMenu();
      fn();
    }
  });
  APP.addEventListener("focusin", (e) => {
    const node = e.target.closest && e.target.closest(".card");
    if (!node || node.dataset.key === S.focus) return;
    for (const n of document.querySelectorAll(".card.focused")) n.classList.remove("focused");
    S.focus = node.dataset.key;
    node.classList.add("focused");
  });
  APP.addEventListener("click", (e) => {
    const node = e.target.closest && e.target.closest(".card");
    if (node && !e.target.closest("button, a, input, select, label, textarea, summary") && node.dataset.key !== S.focus) focusCard(node, false);
  });
  document.addEventListener("click", (e) => {
    if (S.menu && !(e.target.closest && e.target.closest(".menu-wrap"))) closeMenu();
    if (!STATUS_PANEL.hidden && !(e.target.closest && (e.target.closest("#status-panel") || e.target.closest("#status-chip")))) toggleStatus(false);
  });
  OVERLAY.addEventListener("click", (e) => { if (e.target === OVERLAY) closeOverlay(); });
  SEARCH.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => runSearch(SEARCH.value), 200); });
  SEARCH.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    clearTimeout(searchTimer);
    SEARCH.blur();
    runSearch(SEARCH.value);
  });
  CHIP.addEventListener("click", () => toggleStatus());
  byId("btn-help").addEventListener("click", toggleHelp);
  byId("btn-thresholds").addEventListener("click", (e) => {
    TH_PANEL.hidden = !TH_PANEL.hidden;
    e.currentTarget.setAttribute("aria-expanded", String(!TH_PANEL.hidden));
    if (!TH_PANEL.hidden) buildThresholds();
  });
  const onHash = () => { if (readHash()) { S.focus = null; S.menu = null; if (S.overlay) closeOverlay(); render(); window.scrollTo(0, 0); } };
  window.addEventListener("hashchange", onHash);
  window.addEventListener("popstate", onHash);
  let lastWidth = window.innerWidth, resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { measureHeader(); if (Math.abs(window.innerWidth - lastWidth) > 24) { lastWidth = window.innerWidth; render(); } }, 150);
  });

  // ================================================================ start
  restoreQueue();
  readHash();
  renderChrome();
  render();
})();
</script>
</body>
</html>
