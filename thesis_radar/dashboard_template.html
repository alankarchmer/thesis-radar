<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>thesis-radar</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --panel-2: #f0eee8; --ink: #1c1b18; --muted: #66625a; --faint: #99958b;
  --line: #e2dfd7; --line-2: #cdc8bd;
  --accent: #2f5bd3; --accent-soft: rgba(47, 91, 211, 0.10);
  --neg: #c0392b; --neg-soft: rgba(192, 57, 43, 0.08); --pos: #17805a; --pos-soft: rgba(23, 128, 90, 0.10);
  --warn: #9a5b00; --warn-soft: rgba(178, 106, 0, 0.10); --mid: #8b877e;
  --spot: #7048c0; --spot-soft: rgba(112, 72, 192, 0.08);
  --radius: 10px; --shadow: 0 1px 2px rgba(20, 18, 10, 0.05);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151412; --panel: #1e1d1a; --panel-2: #262521; --ink: #ecebe6; --muted: #a8a49b; --faint: #7a766e;
    --line: #34322d; --line-2: #48453e;
    --accent: #8ea8ff; --accent-soft: rgba(142, 168, 255, 0.14);
    --neg: #f07b6f; --neg-soft: rgba(240, 123, 111, 0.11); --pos: #4fc596; --pos-soft: rgba(79, 197, 150, 0.12);
    --warn: #e2a64b; --warn-soft: rgba(226, 166, 75, 0.12); --mid: #8f8b82;
    --spot: #b79cf5; --spot-soft: rgba(183, 156, 245, 0.10); --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); overflow-x: hidden; }
body.locked { overflow: hidden; }
body.has-bar main { padding-bottom: 150px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
code, kbd, .mono { font-family: var(--mono); font-size: 12px; }
code { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; overflow-wrap: anywhere; }
kbd { border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); font-size: 10.5px; background: var(--panel); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* header */
header.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 8px 14px; padding: 10px 16px 6px; flex-wrap: wrap; max-width: 1120px; margin: 0 auto; }
.brand { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
.brand span { color: var(--accent); }
nav#tabs { display: flex; gap: 4px; overflow-x: auto; min-width: 0; flex: 1 1 auto; scrollbar-width: thin; }
.tab { border: 1px solid transparent; background: none; padding: 4px 10px; border-radius: 7px; white-space: nowrap; color: var(--muted); }
.tab:hover { background: var(--panel-2); color: var(--ink); }
.tab.active { background: var(--panel); border-color: var(--line); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.tab .badge { margin-left: 6px; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; text-align: center; line-height: 17px; }
.tools { display: flex; gap: 6px; align-items: center; flex: 0 1 auto; min-width: 0; }
#search { width: 220px; max-width: 100%; min-width: 0; padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 5px 10px; border-radius: 8px; white-space: nowrap; }
.btn:hover { border-color: var(--line-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn[aria-pressed="true"], .btn[aria-expanded="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sub { max-width: 1120px; margin: 0 auto; padding: 0 16px 8px; color: var(--muted); font-size: 12px; display: flex; gap: 4px 12px; flex-wrap: wrap; }
@media (max-width: 640px) { .tools { flex: 1 1 100%; } #search { flex: 1; width: auto; } }

/* thresholds panel, banner */
#thresholds { max-width: 1120px; margin: 12px auto 0; padding: 0 16px; }
.th { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.th-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px 18px; }
.slider { display: grid; grid-template-columns: 1fr 52px; gap: 0 8px; align-items: center; font-size: 12px; color: var(--muted); }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0 0 4px; }
.slider output { text-align: right; font-family: var(--mono); color: var(--ink); grid-row: 1; grid-column: 2; }
.th-counts { margin: 10px 0; display: grid; gap: 4px; font-size: 13px; }
.th-counts .changed { color: var(--accent); font-weight: 600; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
#banner { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.banner { margin-top: 12px; border: 1px solid var(--warn); background: var(--warn-soft); color: var(--ink); border-radius: var(--radius); padding: 8px 12px; font-size: 13px; }
.banner div + div { margin-top: 2px; }
.banner b { color: var(--warn); }

/* layout */
main { max-width: 1120px; margin: 0 auto; padding: 8px 16px 48px; }
h2 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
h3 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); font-weight: 600; }
h4 { font-size: 12px; margin: 12px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.section { margin-top: 22px; }
.section-head { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 6px; }
.count { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel-2); border-radius: 999px; padding: 0 8px; }
.count.neg { color: var(--neg); background: var(--neg-soft); }
details.fold { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
details.fold > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; color: var(--faint); width: 12px; }
details.fold[open] > summary::before { content: "▾"; }
details.fold.inner { border-top: 0; padding-top: 0; margin-top: 8px; }
details.fold.inner > summary { font-size: 13px; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
.pillar-head { margin: 14px 0 4px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pillar-head b { font-size: 13px; }
.pillar-head span { color: var(--muted); font-size: 12px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 4px 0 8px; }
.filters select, .filters input { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 6px; font-size: 12px; max-width: 100%; min-width: 0; }
.filters input[type="search"] { flex: 1 1 140px; }
.confirm { display: inline-flex; gap: 6px; align-items: center; background: var(--warn-soft); border-radius: 8px; padding: 2px 4px 2px 10px; font-size: 12px; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 14px 10px; margin: 8px 0; box-shadow: var(--shadow); scroll-margin: 140px 0 160px; position: relative; }
.card:focus { outline: none; }
.card.focused { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
.card.contra { border-left: 4px solid var(--neg); background: linear-gradient(var(--neg-soft), var(--neg-soft)), var(--panel); }
.card.spot { border: 1.5px dashed var(--spot); background: linear-gradient(var(--spot-soft), var(--spot-soft)), var(--panel); }
.card.done { opacity: 0.72; }
.spot-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; color: var(--spot); font-weight: 600; font-size: 13px; }
.spot-head .muted { font-weight: 400; font-size: 12px; }
.quote { margin: 0 0 7px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; line-height: 1.55; }
.speaker { font-weight: 600; }
mark { background: rgba(255, 200, 0, 0.35); color: inherit; border-radius: 2px; }
.meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; }
.meta + .meta { margin-top: 3px; }
.meta .title { color: var(--ink); overflow-wrap: anywhere; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.chip { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: 11.5px; line-height: 18px; color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
.chip.neg { color: var(--neg); border-color: color-mix(in srgb, var(--neg) 45%, transparent); background: var(--neg-soft); }
.chip.pos { color: var(--pos); border-color: color-mix(in srgb, var(--pos) 45%, transparent); background: var(--pos-soft); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); }
.chip.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
.chip.spot { color: var(--spot); border-color: var(--spot); }
.mbar { display: inline-flex; gap: 2px; vertical-align: middle; }
.mbar i { width: 7px; height: 9px; border-radius: 2px; background: var(--line-2); }
.mbar i.on { background: var(--ink); }
.st-neg { color: var(--neg); } .st-pos { color: var(--pos); } .st-mid { color: var(--mid); }
.actions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; align-items: center; }
.mini { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 1px 7px; font-size: 12px; line-height: 20px; display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.mini:hover { border-color: var(--line-2); background: var(--panel); }
.mini.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.mini.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.mini kbd { padding: 0 3px; font-size: 10px; }
.check { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.panel-x { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); font-size: 12.5px; overflow-wrap: anywhere; }
.panel-x ul { margin: 0; padding-left: 16px; }
.diff { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; line-height: 1.55; }
ins { color: var(--pos); background: var(--pos-soft); text-decoration: underline; text-underline-offset: 2px; }
del { color: var(--neg); background: var(--neg-soft); text-decoration: line-through; }
form.absorb { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; padding: 8px; border-radius: 8px; background: var(--accent-soft); }
form.absorb input[type="text"] { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--panel); }
form.absorb select { border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--panel); max-width: 100%; }
.stub { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--faint); font-size: 12px; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* overview */
.ov { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 16px; box-shadow: var(--shadow); }
.ov-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 12px 0; }
.stat { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.neg b { color: var(--neg); }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px 22px; }
.ov-grid > div { min-width: 0; }
.ov-grid h3 { margin-top: 4px; }
.hm-scroll { overflow-x: auto; padding-bottom: 4px; }
.hm { display: grid; gap: 3px; align-items: center; font-size: 11px; width: max-content; }
.hm .lbl { color: var(--muted); padding-right: 8px; white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
.hm .wk { color: var(--faint); font-size: 10px; white-space: nowrap; overflow: visible; width: 16px; }
.hm .wk:not(:empty) { position: relative; }
.hm-cell { width: 16px; height: 16px; border-radius: 3px; border: 0; padding: 0; color: #fff; font-size: 11px; line-height: 16px; font-weight: 700; text-align: center; }
.hm-cell.neg { background: var(--neg); } .hm-cell.pos { background: var(--pos); } .hm-cell.mid { background: var(--mid); }
.hm-empty { width: 16px; height: 16px; border-radius: 3px; background: var(--panel-2); }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 6px; align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
.asm-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: center; }
.asm-row:last-child { border-bottom: 0; }
.asm-row .meta { grid-column: 1 / -1; }
svg.spark { overflow: visible; }
.spark-line { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.spark-zero { stroke: var(--line-2); stroke-dasharray: 2 2; }
.spark-pos { fill: var(--pos); } .spark-neg { fill: var(--neg); } .spark-mid { fill: var(--mid); }
.div-row { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; margin: 5px 0; }
.div-row.flagged { border-color: var(--warn); background: var(--warn-soft); }
.gauge { height: 6px; border-radius: 3px; background: var(--neg-soft); overflow: hidden; margin: 6px 0; }
.gauge i { display: block; height: 100%; background: var(--pos); }
.plist { list-style: none; margin: 0; padding: 0; }
.plist li { padding: 4px 0; border-bottom: 1px solid var(--line); }
.plist li:last-child { border-bottom: 0; }

/* company extras */
.promise { border-left: 3px solid var(--line-2); padding-left: 10px; margin: 12px 0; }
.promise.kept { border-color: var(--pos); } .promise.missed { border-color: var(--neg); }
.result { margin-left: 14px; }
.change { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: var(--panel); }
.prediction, .fact { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; background: var(--panel); }
.timeline { position: relative; height: 34px; border-bottom: 1px solid var(--line); margin: 2px 0 12px; }
.mark { position: absolute; top: 50%; transform: translate(-50%, -50%); border: 0; padding: 0; opacity: 0.85; border-radius: 50%; }
.mark.square { border-radius: 2px; }
.mark.diamond { border-radius: 1px; transform: translate(-50%, -50%) rotate(45deg); }
.unsorted-cmd { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }

/* skim, overlays, action bar, toasts */
#overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 10, 8, 0.45); display: flex; justify-content: center; align-items: flex-start; padding: 24px 12px; overflow-y: auto; }
#overlay[hidden] { display: none; }
.sheet { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 860px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25); }
.sheet-head { position: sticky; top: -24px; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 8px 12px; align-items: flex-start; justify-content: space-between; border-radius: 14px 14px 0 0; }
.sheet-head > div { min-width: 0; }
.sheet-body { padding: 8px 16px 18px; }
.skim-p { padding: 8px 10px; margin: 6px 0; border-radius: 8px; border: 1px solid transparent; scroll-margin: 110px 0 40px; }
.skim-p .quote { font-size: 14px; margin: 0; }
.skim-p.hl-new { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.skim-p.hl-maybe { background: var(--panel-2); border-color: var(--line-2); }
.skim-p.contra { background: var(--neg-soft); border-color: color-mix(in srgb, var(--neg) 45%, transparent); }
.skim-p.unjudged { color: var(--faint); }
.skim-p.skim-current { box-shadow: 0 0 0 2px var(--accent); }
.skim-note { font-size: 12px; color: var(--warn); margin-top: 4px; }
.help-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
.copybox { width: 100%; font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--panel); }
#actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.08); padding: 8px 16px; }
#actionbar[hidden] { display: none; }
.ab-row { max-width: 1120px; margin: 0 auto; display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; }
.ab-row + .ab-row { margin-top: 6px; }
.cmd { flex: 1 1 260px; min-width: 0; max-height: 3.2em; overflow: auto; white-space: pre-wrap; word-break: break-all; display: block; padding: 3px 6px; }
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: grid; gap: 6px; justify-items: end; pointer-events: none; }
body.has-bar #toasts { bottom: 110px; }
.toast { background: var(--ink); color: var(--bg); padding: 7px 12px; border-radius: 8px; font-size: 13px; max-width: min(420px, calc(100vw - 32px)); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2); }
.toast.error { background: var(--neg); color: #fff; }
@media (max-width: 640px) {
  .card { padding: 10px 11px 9px; }
  .ov { padding: 12px; }
  .ov-grid { grid-template-columns: minmax(0, 1fr); }
  .sheet-body { padding: 6px 10px 14px; }
}
</style>
</head>
<body>
<svg id="svg-ns" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"></svg>
<header class="top">
  <div class="bar">
    <h1 class="brand">thesis<span>·</span>radar</h1>
    <nav id="tabs" role="tablist" aria-label="Views"></nav>
    <div class="tools">
      <input id="search" type="search" placeholder="Search passages ( / )" aria-label="Search passages" autocomplete="off" data-fkey="search">
      <button id="btn-thresholds" class="btn" type="button" aria-expanded="false" aria-controls="thresholds">Thresholds</button>
      <button id="btn-help" class="btn" type="button" aria-label="Keyboard shortcuts">?</button>
    </div>
  </div>
  <div id="meta-line" class="sub"></div>
</header>
<section id="thresholds" hidden aria-label="Thresholds"></section>
<div id="banner"></div>
<main id="app"></main>
<div id="actionbar" hidden></div>
<div id="overlay" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script id="radar-data" type="application/json">__RADAR_DATA__</script>
<script id="radar-logic">
"use strict";
// Pure functions shared with the tests (run under node). No DOM access here.
const RadarLogic = (() => {
  const DAY_MS = 86400000;
  const CLEARS_FEED = ["dismissed", "absorbed"];
  const DEFAULT_POLICY = {
    metadata_min_probability: 0.6, whats_new_window_days: 30, pillar_probability_min: 0.5, boilerplate_max: 0.3,
    new_info_min: 0.6, materiality_min: 1.5, contradictions_window_days: 120, contradicts_min: 0.7,
    contradiction_materiality_min: 1.0, maybe_new_info_low: 0.4, maybe_new_info_high: 0.6, open_questions_min: 0.6,
    divergence_window_days: 120, divergence_min_gap: 1.0, divergence_min_passages: 3, ledger_min_probability: 0.6,
  };
  const isNum = (v) => typeof v === "number" && Number.isFinite(v);
  const num = (v, fallback) => (isNum(v) ? v : fallback);

  // --- dates -------------------------------------------------------------
  function passageDate(passage) {
    if (!passage) return null;
    const raw = passage.date || (passage.ingested_at ? String(passage.ingested_at).slice(0, 10) : null);
    return raw ? String(raw).slice(0, 10) : null;
  }
  function shiftDate(iso, days) {
    return new Date(Date.parse(String(iso).slice(0, 10) + "T00:00:00Z") + days * DAY_MS).toISOString().slice(0, 10);
  }
  function recent(passage, days, today) {
    const d = passageDate(passage);
    return d !== null && d >= shiftDate(today, -Math.trunc(days));
  }
  function weekLabel(week) {
    const iso = /^\d{4}-W(\d{1,2})$/.exec(String(week || ""));
    return iso ? "W" + iso[1] : String(week || "").slice(5, 10);
  }
  function weekStart(week) {
    const s = String(week || "");
    const iso = /^(\d{4})-W(\d{1,2})$/.exec(s);
    if (!iso) return s.slice(0, 10);
    const jan4 = Date.UTC(+iso[1], 0, 4);

    const contradicts = Object.keys(asm).filter((a) => asm[a] && isNum(asm[a].contradicts) && asm[a].contradicts >= min).sort();
    const supports = Object.keys(asm)
      .filter((a) => asm[a] && isNum(asm[a].supports) && asm[a].supports >= min && !contradicts.includes(a)).sort();

  // --- "why am I seeing this" ---------------------------------------------
  const f2 = (v) => (isNum(v) ? v.toFixed(2) : "–");
  const f1 = (v) => (isNum(v) ? v.toFixed(1) : "–");

    if (!passage || !passage.p) return ["Not judged yet, so no thresholds apply to this passage."];
    const c = checks(passage, policy, today);
    const p = c.p, asm = p.assumptions || {}, qs = p.questions || {};

    else if (c.inMaybe) out.push("In Maybe.");
    else if (c.contraRaw && c.status === "acknowledged") out.push("An acknowledged contradiction.");
    else out.push(c.flagged ? "Flagged, but not in a feed right now." : "Not flagged at the current thresholds.");
    for (const a of c.ev.contradicts) tick(true, `contradicts ${a}: P ${f2(asm[a].contradicts)} ≥ ${f2(policy.contradicts_min)}`);
    if (c.ev.contradicts.length) {
      const ok = c.contraRaw;
      tick(ok, `materiality ${f1(c.mat)} ${ok ? "≥" : "<"} ${f1(policy.contradiction_materiality_min)} (contradiction minimum)`);
      if (ok) {
        tick(c.recentContra, `dated ${date}, ${c.recentContra ? "inside" : "outside"} the ${policy.contradictions_window_days}-day contradiction window`);
        if (c.status === "acknowledged") tick(false, "you acknowledged this contradiction");

      }
    }
    if (!c.contraRaw) {
      if (!p.pillar || p.pillar === "off_thesis") tick(false, "off thesis");
      else tick(c.onPillar, `pillar ${p.pillar}: P ${f2(p.pillar_p)} ${c.onPillar ? "≥" : "<"} ${f2(policy.pillar_probability_min)}`);
      const bpOk = c.bp <= policy.boilerplate_max;
      tick(bpOk, `boilerplate P ${f2(c.bp)} ${bpOk ? "≤" : ">"} ${f2(policy.boilerplate_max)}`);
      const matOk = c.mat >= policy.materiality_min;
      tick(matOk, `materiality ${f1(c.mat)} ${matOk ? "≥" : "<"} ${f1(policy.materiality_min)}`);
      const low = policy.maybe_new_info_low, high = policy.maybe_new_info_high;
      if (c.ni >= policy.new_info_min) tick(true, `new to you: P ${f2(c.ni)} ≥ ${f2(policy.new_info_min)}`);
      else if (c.ni >= low && c.ni < high) tick(true, `new to you: P ${f2(c.ni)} in the maybe band [${f2(low)}, ${f2(high)})`);
      else tick(false, `new to you: P ${f2(c.ni)} below ${f2(policy.new_info_min)} and outside the maybe band [${f2(low)}, ${f2(high)})`);
      tick(c.recentNew, `dated ${date}, ${c.recentNew ? "inside" : "outside"} the ${policy.whats_new_window_days}-day What's new window`);
      if (CLEARS_FEED.includes(c.status)) tick(false, `you marked it ${c.status}`);
    }
    for (const a of c.ev.supports) tick(true, `supports ${a}: P ${f2(asm[a].supports)} ≥ ${f2(policy.contradicts_min)}`);
    for (const q of c.ev.questions) tick(true, `bears on open question ${q}: P ${f2(qs[q])} ≥ ${f2(policy.open_questions_min)}`);

  }

  // --- feed layout: every 10th position is a spot check ----------------------

    const n = every || 10, out = [];

  }

  function shellQuote(text) {
    return "'" + String(text).replace(/'/g, "'\\''") + "'";
  }
  function applyCommand(actions) {
    return "radar apply " + shellQuote(JSON.stringify(actions));
  }
  function policyYaml(policy) {
    const pol = Object.assign({}, DEFAULT_POLICY, policy || {});
    const fl = (v) => { const x = Math.round(Number(v) * 1000) / 1000; return Number.isInteger(x) ? x.toFixed(1) : String(x); };
    const int = (v) => String(Math.round(Number(v)));
    return [
      "metadata:",
      `  min_probability: ${fl(pol.metadata_min_probability)}`,
      "whats_new:",
      `  window_days: ${int(pol.whats_new_window_days)}`,
      `  pillar_probability: {min: ${fl(pol.pillar_probability_min)}}`,
      `  boilerplate: {max: ${fl(pol.boilerplate_max)}}`,
      `  new_info: {min: ${fl(pol.new_info_min)}}`,
      `  materiality: {min: ${fl(pol.materiality_min)}}`,
      "contradictions:",
      `  window_days: ${int(pol.contradictions_window_days)}`,
      `  contradicts: {min: ${fl(pol.contradicts_min)}}`,
      `  materiality: {min: ${fl(pol.contradiction_materiality_min)}}`,
      "maybe:",
      `  new_info: {between: [${fl(pol.maybe_new_info_low)}, ${fl(pol.maybe_new_info_high)}]}`,
      "open_questions:",
      `  min: ${fl(pol.open_questions_min)}`,
      "divergence:",
      `  window_days: ${int(pol.divergence_window_days)}`,
      `  min_gap: ${fl(pol.divergence_min_gap)}`,
      `  min_passages: ${int(pol.divergence_min_passages)}`,

      `  min_probability: ${fl(pol.ledger_min_probability)}`,

        p.page !== null && p.page !== undefined ? "p. " + p.page : null].filter(Boolean).join(", ");
      const link = typeof p.link === "string" && p.link.startsWith("file:") ? p.link : null;

<script>
"use strict";
(() => {
  // ================================================================ setup
  const L = RadarLogic;

  // ================================================================ helpers
  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key === "class") node.className = value;
      else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2), value);

      const pr = c.predictions.find((x) => x.id === action.prediction_id);
      if (pr) setOutcome(pr, action.outcome);

  // ================================================================ actions: dispatch, send, undo
  async function api(method, path, body) {

      if (!result || result.ok === false) throw new Error((result && result.error) || "the server rejected the actions");
      S.queue = S.queue.filter((a) => !batch.includes(a));

    ({ op: "label", ticker: c.ticker, passage_id: p.id, question, value, origin: origin || "triage" });

    showOverlay("skim", doc.title, () => skimBody(), { c, doc, passages: local, cur: fromId, expanded: new Set(), loading: false });
    if (TOKEN && !doc.complete) {
      S.overlay.loading = true;
      drawOverlay();
      const mine = S.overlay;
      api("GET", "/api/document/" + encodeURIComponent(docId) + "?ticker=" + encodeURIComponent(c.ticker))
        .then((r) => {
          mine.passages = ((r && r.passages) || []).map((p) => c._byId.get(p.id) || (normalizeTriage(p), p));
          if (r && r.document) mine.doc = Object.assign({}, doc, r.document);
        })
        .catch((err) => toast("Could not load the full document: " + err.message, "error"))
        .finally(() => { mine.loading = false; if (S.overlay === mine) drawOverlay(); });
    }
    setTimeout(() => skimScroll(false), 0);
  }
  function skimKind(p) {
    if (!p.p) return "unjudged";
    const k = cls(p);
    if (k.in_contradictions) return "contra";
    if (k.in_whats_new) return "hl-new";
    if (k.in_maybe) return "hl-maybe";
    if (p.p.boilerplate >= S.policy.boilerplate_max || !p.p.pillar || p.p.pillar === "off_thesis") return "stub";
    return "plain";
  }
  function skimHeader(o) {
    const d = o.doc;
    const n = o.passages.length;
    return el("div", {}, el("h2", {}, d.title || "Document"),
      el("div", { class: "meta" }, el("span", {}, human(d.source_type)), el("span", {}, d.date || "undated"), d.form ? el("span", {}, d.form) : null,
        el("span", {}, n + (d.passage_count ? " of " + d.passage_count : "") + " passages"), linkTo(d.link, "open file ↗"),
        el("span", {}, el("kbd", {}, "n"), " / ", el("kbd", {}, "p"), " jump")),
      !d.complete && !TOKEN ? el("div", { class: "skim-note" }, "Only on-thesis passages are embedded in this file; run radar serve to skim the whole document.") : null,
      o.loading ? el("div", { class: "skim-note" }, "Loading the full document…") : null);
  }
  function skimBody() {
    const o = S.overlay;
    const list = o.passages.slice().sort((a, b) => (a.seq || 0) - (b.seq || 0));
    if (!list.length) return el("p", { class: "empty" }, "No passages of this document are available.");
    return list.map((p) => {
      const kind = skimKind(p);
      if (kind === "stub" && !o.expanded.has(p.id)) {
        return el("button", { type: "button", class: "stub", "data-id": p.id, title: "Expand",
          onclick: () => { o.expanded.add(p.id); drawOverlay(); } },
          "▸ " + (p.p.boilerplate >= S.policy.boilerplate_max ? "boilerplate" : "off thesis") + (p.page !== null && p.page !== undefined ? " · p. " + p.page : "") + " · " + String(p.text).slice(0, 110));
      }
      const k = cls(p);
      const tags = kind === "contra" ? "contradicts " + k.contradicts.join(", ") : kind === "hl-new" ? "What's new" : kind === "hl-maybe" ? "Maybe" : kind === "unjudged" ? "not judged yet" : "";
      return el("div", { class: "skim-p " + kind + (o.cur === p.id ? " skim-current" : ""), "data-id": p.id, "data-kind": kind },
        el("p", { class: "quote" }, p.speaker ? el("span", { class: "speaker" }, p.speaker + ": ") : null, p.text),
        el("div", { class: "meta" }, p.page !== null && p.page !== undefined ? el("span", {}, "p. " + p.page) : null, tags ? el("span", { class: kind === "contra" ? "chip neg" : "chip" }, tags) : null,
          p.p ? el("span", {}, (p.p.pillar || "") + " · material " + f1(p.p.materiality) + " · new " + f2(p.p.new_info)) : null));
    });
  }
  function skimJump(delta) {
    const o = S.overlay;
    const list = o.passages.slice().sort((a, b) => (a.seq || 0) - (b.seq || 0));
    const hl = (p) => ["contra", "hl-new", "hl-maybe"].includes(skimKind(p));
    const at = list.findIndex((p) => p.id === o.cur);
    let i = at;
    for (;;) {
      i = i < 0 && delta < 0 ? list.length - 1 : i + delta;
      if (i < 0 || i >= list.length) { toast(delta > 0 ? "No more highlights below" : "No more highlights above"); return; }
      if (hl(list[i])) break;
    }
    o.cur = list[i].id;
    for (const n of OVERLAY.querySelectorAll(".skim-current")) n.classList.remove("skim-current");
    skimScroll(true);
  }
  function skimScroll(smooth) {
    const o = S.overlay;
    if (!o || o.kind !== "skim" || o.cur === null || o.cur === undefined) return;
    const node = OVERLAY.querySelector('.skim-p[data-id="' + CSS.escape(String(o.cur)) + '"]');
    if (!node) return;
    node.classList.add("skim-current");
    node.scrollIntoView({ block: "center", behavior: smooth ? "smooth" : "auto" });
  }

  // ================================================================ thresholds
  const roundTo = (v, step) => { const d = String(step).includes(".") ? String(step).split(".")[1].length : 0; return Number(Number(v).toFixed(d)); };
  function buildThresholds() {
    const sliders = SLIDERS.map(([key, text, min, max, step]) => el("label", { class: "slider" }, el("span", {}, text),
      el("output", { "data-out": key }, String(S.policy[key])),
      el("input", { type: "range", min, max, step, value: S.policy[key], "data-policy": key, "aria-label": text,
                    oninput: (e) => setPolicy(key, roundTo(e.target.value, step)) })));
    TH_PANEL.replaceChildren(el("div", { class: "th" },
      el("div", { class: "section-head" }, el("h2", {}, "Thresholds"), el("span", { class: "muted small", id: "th-state" }),
        el("span", { class: "muted small" }, "Counts are recomputed here from the embedded probabilities; nothing is sent to Jev.")),
      el("div", { class: "th-grid" }, sliders),
      el("div", { class: "th-counts", id: "th-counts" }),
      el("div", { class: "row" },
        el("button", { class: "btn", type: "button", onclick: () => setAll(S.saved) }, "Reset to saved"),
        el("button", { class: "btn", type: "button", onclick: () => setAll(DEFAULTS) }, "Reset to defaults"),
        el("button", { class: "btn", type: "button", onclick: () => copyText(L.policyYaml(S.policy), "policy.yaml") }, "Copy policy.yaml"),
        TOKEN ? el("button", { class: "btn primary", type: "button", onclick: savePolicy }, "Save") : null)));
    syncThresholds();
  }
  function setPolicy(key, value) {
    S.policy[key] = value;
    if (key === "maybe_new_info_low" && S.policy.maybe_new_info_high <= value) S.policy.maybe_new_info_high = Math.min(1, roundTo(value + 0.01, 0.01));
    if (key === "maybe_new_info_high" && S.policy.maybe_new_info_low >= value) S.policy.maybe_new_info_low = Math.max(0, roundTo(value - 0.01, 0.01));
    scheduleRender();
  }
  function setAll(values) {
    S.policy = Object.assign({}, DEFAULTS, values);
    render();
  }
  function savePolicy() {
    const values = {};
    for (const key of Object.keys(L.DEFAULT_POLICY)) values[key] = S.policy[key];
    S.saved = Object.assign({}, S.policy);
    dispatch([{ op: "policy", values }]);
    render();
  }
  function syncThresholds() {
    if (TH_PANEL.hidden) return;
    for (const input of TH_PANEL.querySelectorAll("input[data-policy]")) {
      const key = input.dataset.policy;
      if (String(input.value) !== String(S.policy[key])) input.value = S.policy[key];
      TH_PANEL.querySelector('[data-out="' + key + '"]').textContent = String(S.policy[key]);
    }
    const dirty = Object.keys(L.DEFAULT_POLICY).some((k) => S.policy[k] !== S.saved[k]);
    document.getElementById("th-state").textContent = dirty ? "changed from saved" : "at saved values";
    document.getElementById("th-counts").replaceChildren(...COMPANIES.map((c) => {
      const before = L.countFeeds(c.passages, S.saved, TODAY), now = L.countFeeds(c.passages, S.policy, TODAY);
      const part = (text, key) => el("span", { class: before[key] !== now[key] ? "changed" : "", "data-live": key },
        text + " " + before[key] + " → " + now[key]);
      return el("div", { "data-ticker": c.ticker }, el("b", {}, c.ticker), " ", part("Contradictions", "contradictions"), " · ",
        part("What's new", "whats_new"), " · ", part("Maybe", "maybe"));
    }));
  }
  let frame = 0;
  function scheduleRender() {
    if (frame) return;
    frame = requestAnimationFrame(() => { frame = 0; render(); });
  }

  // ================================================================ chrome: tabs, banner, action bar
  function renderTabs() {
    const tabs = [["overview", "Overview", null]].concat(COMPANIES.map((c) => [c.ticker, c.ticker, feeds(c).fresh.length]),
      [["unsorted", "Unsorted (" + UNSORTED.length + ")", null]]);
    NAV.replaceChildren(...tabs.map(([key, text, badge]) => el("button", {
      class: "tab" + (S.tab === key && !S.search ? " active" : ""), type: "button", role: "tab", "data-tab": key,
      "aria-selected": String(S.tab === key), onclick: () => switchTab(key) },
      text, badge === null ? null : el("span", { class: "badge", title: "What's new" }, String(badge)))));
  }
  function switchTab(key) {
    S.tab = key;
    S.focus = null;
    S.confirm = null;
    if (S.search) { SEARCH.value = ""; S.search = null; }
    render();
    window.scrollTo(0, 0);
  }
  function renderChrome() {
    const pending = DATA.pending || {};
    const lines = [];
    if (pending.stale) lines.push(el("div", {}, el("b", {}, plural(pending.stale, "stale judgment")), " shown from before your last thesis edit — run ", el("code", {}, "radar judge --all"), " to refresh."));
    if (pending.unjudged) lines.push(el("div", {}, el("b", {}, plural(pending.unjudged, "passage")), " not judged yet — run ", el("code", {}, "radar judge"), "."));
    if (pending.failed) lines.push(el("div", {}, el("b", {}, plural(pending.failed, "judgment")), " failed — run ", el("code", {}, "radar judge --retry-failed"), "."));
    document.getElementById("banner").replaceChildren(...(lines.length ? [el("div", { class: "banner", role: "status" }, lines)] : []));
    document.getElementById("meta-line").replaceChildren(el("span", {}, "generated " + stamp(DATA.generated_at)),
      el("span", {}, "last view " + stamp(DATA.previous_view)),
      el("span", {}, TOKEN ? "connected to radar serve: actions save as you go" : "static file: actions queue at the bottom"),
      el("span", {}, "press ", el("kbd", {}, "?"), " for keys"));
  }
  function renderActionBar() {
    const rows = [];
    if (S.queue.length) {
      const command = L.applyCommand(S.queue);
      rows.push(el("div", { class: "ab-row" },
        el("strong", { "data-queue": S.queue.length }, TOKEN ? plural(S.queue.length, "unsaved action") : plural(S.queue.length, "queued action")),
        el("code", { class: "cmd", id: "apply-command" }, command),
        TOKEN ? el("button", { class: "mini primary", type: "button", onclick: flush }, "Retry") : null,
        el("button", { class: "mini", type: "button", onclick: () => copyText(command, "radar apply command") }, "Copy command"),
        el("button", { class: "mini", type: "button", title: "Forget queued actions (after you ran the command)",
                       onclick: () => { S.queue = []; persist(); renderActionBar(); } }, "Clear")));
    }
    if (S.selected.size) {
      rows.push(el("div", { class: "ab-row" }, el("strong", {}, S.selected.size + " selected"),
        el("button", { class: "mini primary", type: "button", onclick: () => copyText(L.markdownQuotes([...S.selected.values()]), "Markdown quotes") }, "Copy as Markdown quotes"),
        el("button", { class: "mini", type: "button", onclick: () => { S.selected.clear(); render(); } }, "Clear selection")));
    }
    BAR.hidden = !rows.length;
    BAR.replaceChildren(...rows);
    document.body.classList.toggle("has-bar", rows.length > 0);
  }

  // ================================================================ render
  function render() {
    CLS = new WeakMap();
    const active = document.activeElement;
    const fkey = active && active.dataset && active.dataset.fkey;
    const caret = fkey && typeof active.selectionStart === "number" ? [active.selectionStart, active.selectionEnd] : null;
    renderTabs();
    const view = S.search ? viewSearch() : S.tab === "overview" ? viewOverview() : S.tab === "unsorted" ? viewUnsorted() : viewCompany(company(S.tab));
    APP.replaceChildren(...[view].flat(Infinity).filter(Boolean));
    renderActionBar();
    syncThresholds();
    if (S.overlay && S.overlay.kind !== "help") drawOverlay();
    if (fkey && fkey !== "search") {
      const again = document.querySelector('[data-fkey="' + CSS.escape(fkey) + '"]');
      if (again) { again.focus(); if (caret) try { again.setSelectionRange(caret[0], caret[1]); } catch (err) { /* date inputs */ } }
    }
  }

  // ================================================================ keyboard
  function isTyping(t) {
    if (!t || !t.tagName) return false;
    if (t.isContentEditable || t.tagName === "TEXTAREA" || t.tagName === "SELECT") return true;
    return t.tagName === "INPUT" && !["checkbox", "radio", "range", "button", "submit", "reset"].includes(t.type);
  }
  function escape(t, typing) {
    if (S.absorb) { S.absorb = null; render(); refocus(focusIndex()); return; }
    if (S.overlay) { closeOverlay(); return; }
    if (t === SEARCH) { clearSearch(); SEARCH.blur(); return; }
    if (typing) { t.blur(); return; }
    if (S.confirm) { S.confirm = null; render(); return; }
    if (S.search) clearSearch();
  }
  function withCard(fn, allowSpot) {
    const ref = focusedRef();
    if (!ref) { toast("Press j to pick a card first"); return; }
    if (ref.spot && !allowSpot) { toast("This is a spot check: answer y or n"); return; }
    fn(ref);
  }
  const KEYS = {
    j: () => move(1), k: () => move(-1), u: undo, "?": toggleHelp,
    "/": () => { SEARCH.focus(); SEARCH.select(); },
    g: () => { S.g = true; setTimeout(() => { S.g = false; }, 1500); },
    d: () => withCard((r) => leave(r.c, r.p, "d")), x: () => withCard((r) => leave(r.c, r.p, "x")),
    a: () => withCard((r) => startAbsorb(r.c, r.p, r.key)), s: () => withCard((r) => toggleStar(r.c, r.p)),
    c: () => withCard((r) => verdict(r.c, r.p, 1)), f: () => withCard((r) => verdict(r.c, r.p, 0)),
    o: () => withCard((r) => openLink(r.p.link), true), v: () => withCard((r) => openSkim(r.c, r.p.document_id, r.p.id), true),
    y: () => { const r = focusedRef(); if (r && r.spot) answerSpot(r.c, r.p, true); },
    n: () => { const r = focusedRef(); if (r && r.spot) answerSpot(r.c, r.p, false); },
  };
  document.addEventListener("keydown", (e) => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    const typing = isTyping(e.target);
    if (e.key === "Escape") { escape(e.target, typing); return; }
    if (typing) return;
    if (S.overlay && S.overlay.kind === "skim") {
      const fn = { n: () => skimJump(1), p: () => skimJump(-1), o: () => openLink(S.overlay.doc.link), "?": toggleHelp }[e.key];
      if (fn) { e.preventDefault(); fn(); }
      return;
    }
    if (S.overlay) { if (e.key === "?") { e.preventDefault(); toggleHelp(); } return; }
    if (S.g) {
      S.g = false;
      const target = e.key === "o" ? "overview" : e.key === "u" ? "unsorted" : /^[1-9]$/.test(e.key) && COMPANIES[+e.key - 1] ? COMPANIES[+e.key - 1].ticker : null;
      if (target) { e.preventDefault(); switchTab(target); }
      return;
    }
    const fn = KEYS[e.key];
    if (fn) { e.preventDefault(); fn(); }
  });
  APP.addEventListener("focusin", (e) => {
    const node = e.target.closest && e.target.closest(".card");
    if (!node || node.dataset.key === S.focus) return;
    for (const n of document.querySelectorAll(".card.focused")) n.classList.remove("focused");
    S.focus = node.dataset.key;
    node.classList.add("focused");
  });
  APP.addEventListener("click", (e) => {
    const node = e.target.closest && e.target.closest(".card");
    if (node && !e.target.closest("button, a, input, select, label, textarea") && node.dataset.key !== S.focus) focusCard(node, false);
  });
  OVERLAY.addEventListener("click", (e) => { if (e.target === OVERLAY) closeOverlay(); });
  SEARCH.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => runSearch(SEARCH.value), 200); });
  SEARCH.addEventListener("keydown", (e) => { if (e.key === "Enter") { clearTimeout(searchTimer); runSearch(SEARCH.value); } });
  document.getElementById("btn-help").addEventListener("click", toggleHelp);
  document.getElementById("btn-thresholds").addEventListener("click", (e) => {
    TH_PANEL.hidden = !TH_PANEL.hidden;
    e.currentTarget.setAttribute("aria-expanded", String(!TH_PANEL.hidden));
    if (!TH_PANEL.hidden) buildThresholds();
  });

  // ================================================================ start
  restoreQueue();
  renderChrome();
  render();
})();
</script>
</body>
</html>
